---
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present

- name: Create or remove admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    groups: "{{ ['sudo'] if item.sudo | default(true) else [] }}"
    append: true
    state: "{{ item.state | default('present') }}"
    remove: "{{ (item.state | default('present')) == 'absent' }}"
  loop: "{{ baseline_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the .ssh folder of each admin
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ baseline_users_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the SSH keys of each admin
  ansible.builtin.copy:
    dest: "/home/{{ item.name }}/.ssh/authorized_keys"
    content: "{{ (item.ssh_keys | default([])) | join('\n') }}\n"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ baseline_users_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.ssh_keys | default([]) | length > 0

- name: Passwordless sudo when requested
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-baseline-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  loop: "{{ baseline_admin_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sudo_nopasswd | default(false) | bool
    - (item.state | default('present')) == 'present'

- name: Remove passwordless sudo when no longer requested
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-baseline-{{ item.name }}"
    state: absent
  loop: "{{ baseline_admin_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.sudo_nopasswd | default(false) | bool) or (item.state | default('present')) == 'absent'
