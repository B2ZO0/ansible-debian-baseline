---
- name: Install the OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Make sure sshd reads its drop-in folder
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    mode: "0644"

- name: Write the hardened SSH settings
  ansible.builtin.template:
    src: sshd_baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/10-baseline.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply ssh settings

- name: Write the SSH login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ baseline_motd_text }}\n"
    owner: root
    group: root
    mode: "0644"
  when: baseline_ssh_banner | bool
